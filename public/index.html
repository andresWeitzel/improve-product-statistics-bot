<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Historial de Productos</title>
  </head>
  <body>
    <h3>Historial de Visitas a Productos (ML)</h3>
    <div id="connectionStatus" style="color: red; margin-bottom: 10px;">Conectando...</div>
    <table id="statusTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Estado</th>
          <th>Producto</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody id="statusContainer"></tbody>
    </table>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const statusContainer = document.getElementById("statusContainer");
      const connectionStatus = document.getElementById("connectionStatus");
      let productCount = 0;

      // Debug de conexión
      socket.on("connect", () => {
        console.log("✅ Conectado al servidor");
        connectionStatus.textContent = "✅ Conectado al servidor";
        connectionStatus.style.color = "green";
      });

      socket.on("disconnect", () => {
        console.log("❌ Desconectado del servidor");
        connectionStatus.textContent = "❌ Desconectado del servidor";
        connectionStatus.style.color = "red";
      });

      socket.on("connect_error", (error) => {
        console.error("❌ Error de conexión:", error);
        connectionStatus.textContent = "❌ Error de conexión: " + error.message;
        connectionStatus.style.color = "red";
      });

      socket.on("update", ({ id, status, product, url, datetime }) => {
        console.log("📡 Recibido update:", { id, status, product, url, datetime });
        
        const row = document.createElement("tr");
        row.innerHTML = `
                <td>${id}</td>
                <td><div class="lamp ${
                  status === "ok" ? "ok" : "fail"
                }"></div></td>
                <td><a href="${url}" target="_blank">${product}</a></td>
                <td>${datetime}</td>
            `;
        statusContainer.appendChild(row);
        productCount++;

        if (productCount >= 15) {
          productCount = 0;
          location.reload();
        }
      });
    </script>
  </body>
</html>
