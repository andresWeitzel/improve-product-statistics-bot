# Compose project name in Docker Desktop.
name: improve-product-statistics-bot

services:
  improve-product-statistics-bot:
    build: .
    image: improve-product-statistics-bot:local
    container_name: improve-product-statistics-bot
    ports:
      - "9008:9008"
    # Gmail + reporte diario (MAIL_*, REPORT_PLATFORM, etc.)
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "9008"
      TZ: America/Argentina/Buenos_Aires
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      # Persist visit history + browser profiles across rebuilds
      - ./data:/app/data
      # Listings editables sin rebuild (mismo nivel que .env.example)
      - ./facebook.urls.json:/app/facebook.urls.json:ro
      - ./mercadolibre.urls.json:/app/mercadolibre.urls.json:ro
    # Chromium needs extra shared memory; avoid /dev/shm crashes
    shm_size: "256mb"
    restart: unless-stopped
